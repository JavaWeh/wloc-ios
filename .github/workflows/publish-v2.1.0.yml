name: Publish verified v2.1.0 release
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-v2.1.0.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-wloc-v2.1.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: JavaWeh/wloc-ios
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6d27309459e8d346e2eac86dd6443b65a86bc8f4
          persist-credentials: false
      - name: Fetch the validated IPA and prepare source and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/validated-artifact dist
          gh run download 39232732356 --name WLoc-unsigned-ipa --dir build/validated-artifact
          printf '%s  %s\n' '46683177923029ce39778ce5e5c110e7e39453c08db54cb36d7564cf63f8fb29' 'build/validated-artifact/WLoc-unsigned.ipa' | sha256sum --check
          cp build/validated-artifact/WLoc-unsigned.ipa dist/WLoc-Native-v2.1.0-unsigned.ipa
          python3 scripts/package_source.py
          cd dist
          sha256sum WLoc-Native-v2.1.0-unsigned.ipa WLoc-iOS-source.zip > SHA256SUMS.txt
          sha256sum WLoc-Native-v2.1.0-unsigned.ipa > WLoc-Native-v2.1.0-unsigned.ipa.sha256
      - name: Prepare release notes
        shell: bash
        run: |
          cat > build/release-notes.md <<'NOTES'
          ## WLoc Native 2.1.0（构建 4）

          无需自建后台的 iPhone 常用定位收藏工具。支持地图分享链接解析、原生地图搜索 / 选点和常用坐标快速写入。

          ### 本次更新

          - 增加 Surge、Loon、Stash、Quantumult X、Shadowrocket 五端配置生成与本机协议适配。
          - 自动生成含独立配对密钥的专属配置；提供实验性快捷安装和文件导入备用方式。
          - 临时安装服务仅监听 127.0.0.1，随机令牌和端口，最长 120 秒；运行时不依赖该服务。
          - 保留旧版 Surge 配对及本机收藏，脚本固定到经过构建验证的 Git 提交。

          ### 下载与安装

          1. 下载附件 **WLoc-Native-v2.1.0-unsigned.ipa**，使用自己的签名工具自签安装。此 IPA 未签名，不能直接安装。
          2. App 齿轮页选择当前工具。Surge、Loon、Stash 可尝试快捷安装；Quantumult X、Shadowrocket 优先文件导入。
          3. 在目标工具确认安装并启用组件、停用旧 WLOC 模块。MITM 证书仍须自行安装并信任。
          4. 返回 App 验证连接，点选收藏写入坐标，再按已有步骤刷新系统定位并在地图确认。

          最低 iOS 16；Bundle ID 为 `com.wloc.quicklocation`。专属配置含本机密钥，请勿公开分享。

          ### 验证与限制

          [macOS 构建及测试](https://github.com/JavaWeh/wloc-ios/actions/runs/39232732356) 已通过：40 项 Swift 测试、五端控制与真实二进制 WLOC 集成、3 项 Python 打包测试，以及 iPhoneOS arm64 Release 编译。

          **五端快捷导入、重启后配置保留和真实定位效果仍待真机验证。快捷安装为实验功能；CI 通过不等同于真机支持认证。** App 无法清除 iOS 定位缓存或控制 GPS 优先级。

          源码标签对应 `6d27309459e8d346e2eac86dd6443b65a86bc8f4`；IPA 编译及固定脚本提交为 `9eae529672ab574e807ad2fe453dff13c23719c5`，两者仅文档记录不同。

          IPA SHA-256：`46683177923029ce39778ce5e5c110e7e39453c08db54cb36d7564cf63f8fb29`。

          附件另含完整源码包与 SHA-256 校验文件。许可证为 AGPL-3.0-or-later；[使用说明](https://github.com/JavaWeh/wloc-ios/blob/v2.1.0/README.md)、[审计记录](https://github.com/JavaWeh/wloc-ios/blob/v2.1.0/AUDIT.md)、[第三方署名](https://github.com/JavaWeh/wloc-ios/blob/v2.1.0/THIRD_PARTY.md)。
          NOTES
      - name: Upload all assets before publishing
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.1.0 --json isDraft > build/existing-release.json 2>/dev/null; then
            if [ "$(jq -r '.isDraft' build/existing-release.json)" != 'true' ]; then
              echo 'v2.1.0 is already published; preserving the existing release.'
              exit 0
            fi
          else
            gh release create v2.1.0 --target 6d27309459e8d346e2eac86dd6443b65a86bc8f4 --title 'WLoc Native v2.1.0 · 五端配对与快捷安装' --notes-file build/release-notes.md --draft
          fi
          gh release upload v2.1.0 dist/WLoc-Native-v2.1.0-unsigned.ipa dist/WLoc-iOS-source.zip dist/SHA256SUMS.txt dist/WLoc-Native-v2.1.0-unsigned.ipa.sha256 --clobber
          gh release edit v2.1.0 --notes-file build/release-notes.md --draft=false --latest
          gh release view v2.1.0 --json url,isDraft,tagName,assets

